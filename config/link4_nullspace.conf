# New case only. Uses the regular Euclidean Jacobian projector, not inertia.
# "pose": project away XYZ and orientation components (normally 1 null DOF).
# "position": project away XYZ components only (normally 4 null DOFs).
task = "pose";
gain = 1.0;
sign = 1.0;
filter_hz = 10.0;
torque_limit_nm = 4.0;
slew_limit_nm_s = 5.0;
# Reject a near-singular task rather than dropping additional task directions.
relative_rank_tolerance = 0.000001;
